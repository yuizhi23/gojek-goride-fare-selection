<svg width="360" height="800" viewBox="0 0 360 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
    </style>
  </defs>

  <rect width="360" height="800" fill="#FFFFFF"/>

  <!-- Status Bar -->
  <rect width="360" height="28" fill="#FFFFFF"/>
  <text x="20" y="19" font-size="11" font-weight="600" fill="#1A1A1A">08:15</text>

  <!-- Top Bar -->
  <g id="Organism-TopBar">
    <path d="M28 50L20 58L28 66" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="63" font-size="18" font-weight="600" fill="#1A1A1A">Preferensi Tarif</text>
    <line x1="0" y1="84" x2="360" y2="84" stroke="#F3F4F6" stroke-width="1"/>
  </g>

  <!-- Subtitle -->
  <text x="16" y="112" font-size="13" font-weight="400" fill="#5F6368">Atur default pilihan tarif saat kamu memesan. Sistem akan</text>
  <text x="16" y="130" font-size="13" font-weight="400" fill="#5F6368">otomatis memilihkan opsi sesuai kebiasaanmu.</text>

  <!-- Service Preferences Rows -->
  <!-- 1. GoRide -->
  <g id="Molekul-Pref-GoRide">
    <text x="16" y="174" font-size="16" font-weight="600" fill="#1A1A1A">GoRide</text>
    <text x="16" y="192" font-size="12" font-weight="400" fill="#5F6368">Ojek motor harian</text>
    <!-- Segmented Control (Hemat active) -->
    <rect x="200" y="160" width="144" height="36" rx="8" fill="#F3F4F6"/>
    <rect x="202" y="162" width="70" height="32" rx="6" fill="#FFFFFF"/>
    <text x="237" y="182" font-size="13" font-weight="600" fill="#0B6E4F" text-anchor="middle">Hemat</text>
    <text x="309" y="182" font-size="13" font-weight="500" fill="#5F6368" text-anchor="middle">Cepat</text>
  </g>

  <!-- 2. GoCar -->
  <g id="Molekul-Pref-GoCar">
    <text x="16" y="234" font-size="16" font-weight="600" fill="#1A1A1A">GoCar</text>
    <text x="16" y="252" font-size="12" font-weight="400" fill="#5F6368">Mobil roda empat</text>
    <rect x="200" y="220" width="144" height="36" rx="8" fill="#F3F4F6"/>
    <rect x="202" y="222" width="70" height="32" rx="6" fill="#FFFFFF"/>
    <text x="237" y="242" font-size="13" font-weight="600" fill="#0B6E4F" text-anchor="middle">Hemat</text>
    <text x="309" y="242" font-size="13" font-weight="500" fill="#5F6368" text-anchor="middle">Cepat</text>
  </g>

  <!-- 3. GoSend -->
  <g id="Molekul-Pref-GoSend">
    <text x="16" y="294" font-size="16" font-weight="600" fill="#1A1A1A">GoSend</text>
    <text x="16" y="312" font-size="12" font-weight="400" fill="#5F6368">Pengiriman barang</text>
    <rect x="200" y="280" width="144" height="36" rx="8" fill="#F3F4F6"/>
    <rect x="202" y="282" width="70" height="32" rx="6" fill="#FFFFFF"/>
    <text x="237" y="302" font-size="13" font-weight="600" fill="#0B6E4F" text-anchor="middle">Hemat</text>
    <text x="309" y="302" font-size="13" font-weight="500" fill="#5F6368" text-anchor="middle">Cepat</text>
  </g>

  <!-- 4. GoFood (Default: Cepat) -->
  <g id="Molekul-Pref-GoFood">
    <text x="16" y="354" font-size="16" font-weight="600" fill="#1A1A1A">GoFood</text>
    <text x="16" y="372" font-size="12" font-weight="400" fill="#5F6368">Pesan antar makanan</text>
    <rect x="200" y="340" width="144" height="36" rx="8" fill="#F3F4F6"/>
    <rect x="272" y="342" width="70" height="32" rx="6" fill="#FFFFFF"/>
    <text x="237" y="362" font-size="13" font-weight="500" fill="#5F6368" text-anchor="middle">Hemat</text>
    <text x="307" y="362" font-size="13" font-weight="600" fill="#0B6E4F" text-anchor="middle">Cepat</text>
  </g>

  <line x1="16" y1="400" x2="344" y2="400" stroke="#F3F4F6" stroke-width="1"/>

  <!-- Slider: Batas Tambahan Waktu Jemput -->
  <g id="Molekul-SliderWaktu">
    <text x="16" y="434" font-size="16" font-weight="600" fill="#1A1A1A">Batas tambahan waktu jemput</text>
    <text x="344" y="434" font-size="16" font-weight="600" fill="#0B6E4F" text-anchor="end">+3 menit</text>
    <text x="16" y="456" font-size="12" font-weight="400" fill="#5F6368">Jika jemput Hemat melebihi waktu Cepat lebih dari batas ini,</text>
    <text x="16" y="472" font-size="12" font-weight="400" fill="#5F6368">kami otomatis pilihkan Cepat agar tidak terlambat.</text>

    <!-- Slider Track -->
    <rect x="16" y="500" width="328" height="6" rx="3" fill="#D1D5DB"/>
    <rect x="16" y="500" width="98" height="6" rx="3" fill="#0B6E4F"/>
    <!-- Slider Thumb (+3 mins at ~30%) -->
    <circle cx="114" cy="503" r="11" fill="#0B6E4F"/>
    <circle cx="114" cy="503" r="4" fill="#FFFFFF"/>

    <text x="16" y="528" font-size="11" font-weight="500" fill="#8D949E">0 mnt</text>
    <text x="114" y="528" font-size="11" font-weight="600" fill="#0B6E4F" text-anchor="middle">+3 mnt</text>
    <text x="210" y="528" font-size="11" font-weight="500" fill="#8D949E">+5 mnt</text>
    <text x="344" y="528" font-size="11" font-weight="500" fill="#8D949E" text-anchor="end">+10 mnt</text>
  </g>

  <!-- Info box -->
  <rect x="16" y="556" width="328" height="52" rx="8" fill="#F3F4F6"/>
  <text x="28" y="578" font-size="12" font-weight="400" fill="#5F6368">Kamu tetap bisa mengganti kartu tarif sewaktu memesan</text>
  <text x="28" y="596" font-size="12" font-weight="400" fill="#5F6368">sebelum menekan tombol konfirmasi.</text>

  <!-- Primary Button: Simpan Preferensi -->
  <g id="Atom-ButtonSimpan">
    <rect x="16" y="680" width="328" height="48" rx="8" fill="#0B6E4F"/>
    <text x="180" y="710" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Simpan Preferensi</text>
  </g>
</svg>