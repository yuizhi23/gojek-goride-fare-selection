<svg width="360" height="800" viewBox="0 0 360 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
    </style>
    <filter id="shadow-sheet" x="-10" y="360" width="380" height="460" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="-4" stdDeviation="10" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow-card" x="0" y="0" width="100%" height="100%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="360" height="800" fill="#FFFFFF"/>

  <!-- Status Bar (28dp) -->
  <g id="Layar-PilihTarif-StatusBar">
    <rect width="360" height="28" fill="#FFFFFF" fill-opacity="0.9"/>
    <text x="20" y="19" font-size="11" font-weight="600" fill="#1A1A1A">08:15</text>
    <!-- Wi-Fi & Battery -->
    <path d="M305 13C306.5 11 310 9 313 13M308 15C309 13.5 311 13.5 312 15" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="325" y="10" width="18" height="9" rx="2" stroke="#1A1A1A" stroke-width="1.2" fill="none"/>
    <rect x="327" y="12" width="12" height="5" rx="1" fill="#1A1A1A"/>
  </g>

  <!-- Map Background Simulation -->
  <g id="Organism-MapBackground">
    <rect y="28" width="360" height="420" fill="#E8ECE9"/>
    <!-- Parks -->
    <path d="M20 70C50 60 110 80 90 150C70 220 10 210 20 70Z" fill="#D3E7D3"/>
    <path d="M260 110C310 120 350 170 330 230C300 270 240 240 260 110Z" fill="#D3E7D3"/>
    <!-- Roads -->
    <path d="M-20 210H380" stroke="#FFFFFF" stroke-width="14"/>
    <path d="M120 10V380" stroke="#FFFFFF" stroke-width="14"/>
    <path d="M270 10V380" stroke="#FFFFFF" stroke-width="10"/>
    <!-- Route Line -->
    <path d="M70 160L120 160L120 250L250 250L250 180" stroke="#0B6E4F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 1"/>
    
    <!-- Pickup Pin: Kost Raka -->
    <circle cx="70" cy="160" r="16" fill="#0B6E4F" fill-opacity="0.2"/>
    <circle cx="70" cy="160" r="8" fill="#0B6E4F"/>
    <circle cx="70" cy="160" r="3" fill="#FFFFFF"/>
    <rect x="25" y="122" width="90" height="24" rx="4" fill="#FFFFFF"/>
    <text x="70" y="138" font-size="11" font-weight="600" fill="#1A1A1A" text-anchor="middle">Kost Raka</text>

    <!-- Destination Pin: Kampus -->
    <circle cx="250" cy="180" r="16" fill="#DC2626" fill-opacity="0.2"/>
    <circle cx="250" cy="180" r="8" fill="#DC2626"/>
    <circle cx="250" cy="180" r="3" fill="#FFFFFF"/>
    <rect x="210" y="142" width="80" height="24" rx="4" fill="#FFFFFF"/>
    <text x="250" y="158" font-size="11" font-weight="600" fill="#1A1A1A" text-anchor="middle">Kampus</text>

    <!-- Floating Back Button -->
    <g id="Atom-BackButton">
      <circle cx="36" cy="62" r="20" fill="#FFFFFF" filter="url(#shadow-card)"/>
      <path d="M39 56L33 62L39 68" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Scrim overlay (40% black) -->
  <rect y="28" width="360" height="350" fill="#000000" fill-opacity="0.25"/>

  <!-- Organism: Bottom Sheet (Top radius 16) -->
  <g id="Organism-BottomSheetPilihTarif">
    <!-- Sheet background with top radius 16 -->
    <path d="M0 394C0 385.163 7.16344 378 16 378H344C352.837 378 360 385.163 360 394V800H0V394Z" fill="#FFFFFF" filter="url(#shadow-sheet)"/>
    
    <!-- Drag Handle -->
    <rect x="162" y="388" width="36" height="4" rx="2" fill="#D1D5DB"/>

    <!-- Header Section -->
    <g id="Molekul-WarningBannerE1">
      <rect x="16" y="380" width="328" height="48" rx="8" fill="#FFF4E0" stroke="#FCD34D"/>
      <text x="28" y="400" font-size="11" font-weight="700" fill="#8A5A00">Jemput Hemat 12 menit, melewati batas +3 menit.</text>
      <text x="28" y="416" font-size="11" font-weight="500" fill="#8A5A00">Kami pilihkan Cepat. (Hemat tetap bisa kamu pilih).</text>
    </g>
    <g id="Molekul-SheetHeader">
      <text x="16" y="420" font-size="16" font-weight="600" fill="#1A1A1A">Pilihan Tarif GoRide</text>
      <text x="175" y="420" font-size="12" font-weight="400" fill="#5F6368">• 3.2 km</text>
      <text x="344" y="420" font-size="12" font-weight="600" fill="#0B6E4F" text-anchor="end">Ubah preferensi</text>
    </g>

    <!-- 2 Kartu Opsi Sejajar (Equal Visual Weight 50-50) -->
    <!-- KARTU 1: HEMAT (Selected = 2px primary border, white background) -->
    <g id="Molekul-KartuOpsiTarif-Hemat">
      <rect x="16" y="440" width="160" height="106" rx="8" fill="#FFFFFF" stroke="#0B6E4F" stroke-width="2"/>
      
      <!-- Service Label -->
      <text x="28" y="464" font-size="16" font-weight="600" fill="#1A1A1A">Hemat</text>
      
      <!-- Radio Button (Selected) -->
      <circle cx="160" cy="459" r="9" stroke="#0B6E4F" stroke-width="2" fill="none"/>
      <circle cx="160" cy="459" r="5" fill="#0B6E4F"/>

      <!-- Price -->
      <text x="28" y="492" font-size="20" font-weight="600" fill="#1A1A1A">Rp7.000</text>

      <!-- Pickup Time -->
      <path d="M30 511C27.8 511 26 512.8 26 515C26 517.2 27.8 519 30 519C32.2 519 34 517.2 34 515C34 512.8 32.2 511 30 511ZM30 513V515.2L31.8 516.4" stroke="#5F6368" stroke-width="1.2" fill="none"/>
      <text x="38" y="517" font-size="12" font-weight="500" fill="#5F6368">Jemput 6 mnt</text>

      <!-- Badge "Sesuai preferensi" -->
      <rect x="28" y="525" width="108" height="17" rx="4" fill="#E8F3EE"/>
      <text x="33" y="537" font-size="11" font-weight="600" fill="#0B6E4F">Sesuai preferensi</text>
    </g>

    <!-- KARTU 2: CEPAT (Unselected = 1px border #8D949E, identical white background) -->
    <g id="Molekul-KartuOpsiTarif-Cepat">
      <rect x="184" y="440" width="160" height="106" rx="8" fill="#FFFFFF" stroke="#8D949E" stroke-width="1"/>
      
      <!-- Service Label -->
      <text x="196" y="464" font-size="16" font-weight="600" fill="#1A1A1A">Cepat</text>
      
      <!-- Radio Button (Unselected) -->
      <circle cx="328" cy="459" r="9" stroke="#8D949E" stroke-width="2" fill="none"/>

      <!-- Price -->
      <text x="196" y="492" font-size="20" font-weight="600" fill="#1A1A1A">Rp11.500</text>

      <!-- Pickup Time -->
      <path d="M198 511C195.8 511 194 512.8 194 515C194 517.2 195.8 519 198 519C200.2 519 202 517.2 202 515C202 512.8 200.2 511 198 511ZM198 513V515.2L199.8 516.4" stroke="#5F6368" stroke-width="1.2" fill="none"/>
      <text x="206" y="517" font-size="12" font-weight="500" fill="#5F6368">Jemput 4 mnt</text>
    </g>

    <!-- Molekul: Strip Selisih (Single line, primary-subtle background) -->
    <g id="Molekul-StripSelisih">
      <rect x="16" y="560" width="328" height="38" rx="8" fill="#E8F3EE"/>
      <!-- Icon Sparkle / Delta -->
      <path d="M30 579V569M35 572H28C27 572 26 573 26 574C26 575 27 576 28 576H32C33 576 34 577 34 578C34 579 33 580 32 580H25" stroke="#0B6E4F" stroke-width="1.5" stroke-linecap="round"/>
      <text x="42" y="584" font-size="13" font-weight="600" fill="#0B6E4F">Hemat Rp4.500, jemput +2 menit</text>
    </g>

    <!-- Payment & Promo Mini Bar -->
    <g id="Molekul-PaymentPromoBar">
      <text x="16" y="626" font-size="12" font-weight="700" fill="#0284C7">GoPay</text>
      <text x="58" y="626" font-size="12" font-weight="600" fill="#1A1A1A">Rp54.200</text>
      <text x="344" y="626" font-size="12" font-weight="600" fill="#0B6E4F" text-anchor="end">Promo 10% aktif ›</text>
      <line x1="16" y1="638" x2="344" y2="638" stroke="#F3F4F6" stroke-width="1"/>
    </g>

    <!-- Primary Action Button (Height 48, radius 8, full width in thumb zone) -->
    <g id="Atom-ButtonPesanGoRide">
      <rect x="16" y="654" width="328" height="48" rx="8" fill="#0B6E4F"/>
      <text x="180" y="684" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Pesan GoRide Hemat</text>
    </g>

    <!-- Home Indicator bar -->
    <rect x="144" y="786" width="72" height="4" rx="2" fill="#1A1A1A"/>
  </g>
</svg>