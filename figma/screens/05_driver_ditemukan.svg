<svg width="360" height="800" viewBox="0 0 360 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
    </style>
  </defs>

  <rect width="360" height="800" fill="#FFFFFF"/>
  <rect width="360" height="28" fill="#FFFFFF"/>
  <text x="20" y="19" font-size="11" font-weight="600" fill="#1A1A1A">08:15</text>

  <!-- Map with Driver Simulation -->
  <rect y="28" width="360" height="420" fill="#E8ECE9"/>
  <path d="M-20 210H380" stroke="#FFFFFF" stroke-width="14"/>
  <path d="M120 10V380" stroke="#FFFFFF" stroke-width="14"/>
  
  <!-- Driver Route -->
  <path d="M100 190L120 190L120 160L70 160" stroke="#0B6E4F" stroke-width="5" stroke-linecap="round"/>
  <circle cx="70" cy="160" r="10" fill="#0284C7"/>
  <circle cx="100" cy="190" r="14" fill="#0B6E4F"/>
  <circle cx="100" cy="190" r="6" fill="#FFFFFF"/>

  <!-- Bottom Sheet Driver Info -->
  <g id="Organism-BottomSheetDriver">
    <path d="M0 430C0 421.163 7.16344 414 16 414H344C352.837 414 360 421.163 360 430V800H0V430Z" fill="#FFFFFF"/>
    <rect x="162" y="422" width="36" height="4" rx="2" fill="#D1D5DB"/>

    <!-- ETA & Price -->
    <rect x="16" y="440" width="136" height="20" rx="4" fill="#E8F3EE"/>
    <text x="22" y="454" font-size="11" font-weight="600" fill="#0B6E4F">Driver menuju lokasimu</text>
    <text x="16" y="482" font-size="20" font-weight="700" fill="#1A1A1A">Tiba dalam 4 menit</text>
    
    <text x="344" y="460" font-size="11" font-weight="400" fill="#5F6368" text-anchor="end">Tarif Terpilih</text>
    <text x="344" y="482" font-size="16" font-weight="700" fill="#0B6E4F" text-anchor="end">Rp7.000</text>

    <!-- Driver Card -->
    <g id="Molekul-KartuDriver">
      <rect x="16" y="504" width="328" height="76" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
      <circle cx="52" cy="542" r="24" fill="#E5E7EB"/>
      <circle cx="52" cy="536" r="8" fill="#9CA3AF"/>
      <path d="M38 554C38 548 44 546 52 546C60 546 66 548 66 554" fill="#9CA3AF"/>

      <text x="88" y="534" font-size="16" font-weight="600" fill="#1A1A1A">Budi Santoso</text>
      <text x="328" y="534" font-size="13" font-weight="700" fill="#D97706" text-anchor="end">★ 4.9</text>
      <text x="88" y="554" font-size="14" font-weight="700" fill="#1A1A1A" letter-spacing="0.5">B 1234 GJK</text>
      <text x="88" y="570" font-size="12" font-weight="400" fill="#5F6368">Honda Vario 125 • Hitam</text>
    </g>

    <!-- Savings Banner -->
    <g id="Molekul-SavingsBanner">
      <rect x="16" y="592" width="328" height="48" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
      <text x="28" y="612" font-size="12" font-weight="700" fill="#166534">Hebat! Kamu hemat Rp4.500 di perjalanan ini</text>
      <text x="28" y="628" font-size="12" font-weight="400" fill="#166534">dan Rp36.000 bulan ini dengan opsi Hemat.</text>
    </g>

    <!-- Two Action Buttons (Hubungi & Lacak) -->
    <g id="Molekul-ActionButtons">
      <!-- Hubungi (Secondary) -->
      <rect x="16" y="654" width="158" height="48" rx="8" fill="#FFFFFF" stroke="#0B6E4F" stroke-width="1.5"/>
      <text x="95" y="684" font-size="16" font-weight="600" fill="#0B6E4F" text-anchor="middle">Hubungi</text>
      
      <!-- Lacak (Primary) -->
      <rect x="186" y="654" width="158" height="48" rx="8" fill="#0B6E4F"/>
      <text x="265" y="684" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Lacak</text>
    </g>
  </g>
</svg>